name: mapvlog
description: "GPS 타임스탬프 기반 브이로그 플랫폼"
publish_to: 'none'

version: 1.73.1+120

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 지도
  google_maps_flutter: ^2.5.3

  # GPS 위치
  geolocator: ^13.0.1
  geolocator_android: ^4.6.2   # 백그라운드 포그라운드 서비스 설정(AndroidSettings)

  # 카메라·사진
  camera: ^0.11.0
  image_picker: ^1.1.2
  exif: ^3.3.0
  image: ^4.3.0              # EXIF 회전 교정
  video_thumbnail: ^0.5.3    # 동영상 썸네일 추출

  # 영상 플레이어
  video_player: ^2.9.1

  # 동영상 압축 (업로드 크기 80% 감소)
  video_compress: ^3.1.2

  # 폰 갤러리 저장 (마법사 촬영 결과 → 사용자 사진첩 자동 저장)
  gal: ^2.3.0

  # HTTP (역지오코딩 Nominatim — 웹/모바일 공용 도로명 주소)
  http: ^1.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3   # 베타 크래시 모니터링(Android)

  # 상태관리
  provider: ^6.1.2

  # 공유 / URL 실행
  share_plus: ^10.0.0
  url_launcher: ^6.2.0    # 스트리트뷰 외부 열기

  # 로컬 저장
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1

  # Google 로그인
  google_sign_in: ^6.2.1

  # 역지오코딩 (좌표 → 주소)
  geocoding: ^3.0.0

  # 환경변수
  flutter_dotenv: ^5.2.1

  # 임시 디렉토리 (다운로드 저장용)
  path_provider: ^2.1.0

  # 웹 파일 드래그&드롭
  flutter_dropzone: ^4.0.1

  # 가속도계 (카메라 화면 아이콘 회전용 + 라이브맵 이동 감지)
  sensors_plus: ^4.0.2

  # 배터리 잔량 (라이브맵 절전 모드)
  battery_plus: ^6.0.3

  # QR 코드 생성 + 스캔 (친구 추가)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # 피드 동영상 자동 미리보기 (Inview 감지)
  visibility_detector: ^0.4.0+2

  # 이미지 자르기 (프로필 사진 등)
  image_cropper: ^8.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ── Windows 한글 사용자명 경로 문제 우회 ─────────────────────────────────────
# path_provider_android 2.3.x 가 jni(C++) 빌드를 포함하는데,
# CMake/ninja 가 한글 경로를 처리 못해 빌드 실패함.
# jni 의존성이 없는 2.2.x 대로 고정해 우회.
dependency_overrides:
  path_provider_android: '>=2.2.0 <2.3.0'

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
