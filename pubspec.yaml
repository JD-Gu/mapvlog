name: mapvlog
description: "GPS 타임스탬프 기반 브이로그 플랫폼"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 지도
  google_maps_flutter: ^2.5.3

  # GPS 위치
  geolocator: ^13.0.1

  # 카메라·사진
  camera: ^0.11.0
  image_picker: ^1.1.2
  exif: ^3.3.0
  image: ^4.3.0              # EXIF 회전 교정
  video_thumbnail: ^0.5.3    # 동영상 썸네일 추출

  # 영상 플레이어
  video_player: ^2.9.1

  # 동영상 압축 (업로드 크기 80% 감소)
  video_compress: ^3.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # 상태관리
  provider: ^6.1.2

  # 공유 / URL 실행
  share_plus: ^10.0.0
  url_launcher: ^6.2.0    # 스트리트뷰 외부 열기

  # 로컬 저장
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1

  # Google 로그인
  google_sign_in: ^6.2.1

  # 역지오코딩 (좌표 → 주소)
  geocoding: ^3.0.0

  # 환경변수
  flutter_dotenv: ^5.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ── Windows 한글 사용자명 경로 문제 우회 ─────────────────────────────────────
# path_provider_android 2.3.x 가 jni(C++) 빌드를 포함하는데,
# CMake/ninja 가 한글 경로를 처리 못해 빌드 실패함.
# jni 의존성이 없는 2.2.x 대로 고정해 우회.
dependency_overrides:
  path_provider_android: '>=2.2.0 <2.3.0'

flutter:
  uses-material-design: true

  assets:
    - .env
